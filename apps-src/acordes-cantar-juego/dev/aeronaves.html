<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aeronaves · Inspector · Aerostato</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0f1c2e;color:#e6f0fa;font-family:system-ui,sans-serif}
    main{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100dvh}#viewport{min-width:0;min-height:0}
    canvas{width:100%;height:100%;display:block;touch-action:none}
    aside{padding:28px 22px;background:#142338;border-left:1px solid #233c5c;overflow:auto}
    h1{font-size:28px;line-height:1.1;font-weight:550;margin:12px 0 18px}p{font-size:14px;line-height:1.6;color:#a9bfd6}
    a{color:#8fd0ff}label{display:block;margin-top:18px;font-size:14px}
    select,button{font:inherit;width:100%;padding:11px;margin:6px 0;border:1px solid #3b5b80;border-radius:7px;background:#1b3150;color:#e6f0fa;cursor:pointer}
    button:hover{background:#26416a}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #8fd0ff;outline-offset:3px}
    output{display:block;font-size:13px;color:#b9cde2;margin:16px 0;line-height:1.7}
    @media(max-width:700px){main{height:auto;grid-template-columns:1fr}#viewport{height:60dvh}aside{padding:22px}}
  </style>
</head>
<body><main>
  <div id="viewport"><canvas aria-label="Aeronave en tres dimensiones"></canvas></div>
  <aside><a href="/">Abrir Aerostato</a><h1>Aeronaves por capa</h1>
    <p>Modelos de Blender que cruzan a lo lejos en las capas 2 a 5. Se ven con su animación del juego: hélice, balanceo, estela, paneles y baliza. Arrastra para girar y usa la rueda para acercarte.</p>
    <label for="kind">Aeronave</label>
    <select id="kind">
      <option value="plane">Avioneta · capa 2</option>
      <option value="jet">Jet comercial · capa 3</option>
      <option value="strato">Estratosférico · capa 4</option>
      <option value="satellite">Satélite · capa 5</option>
    </select>
    <button id="far">Ver a distancia de juego (60 u)</button>
    <button id="near">Ver de cerca (15 u)</button>
    <button id="pause" aria-pressed="false">Pausar animación</button>
    <output id="status" aria-live="polite">Cargando modelo…</output><output id="stats"></output>
  </aside>
</main><script type="module" src="./aeronaves.ts"></script></body></html>
