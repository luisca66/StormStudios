<body data-theme="vortex">
  <div id="app">
    <header class="global-topbar">
      <div class="brand" data-i18n="brand">METRÓNOMO PRO</div>
      <div class="top-controls">
        <select id="theme-select" class="theme-select" aria-label="Tema visual" data-i18n-aria="theme">
          <option value="vortex" data-i18n="vortex">A - Vórtice</option>
          <option value="membrane" data-i18n="membrane">B - Péndulo</option>
          <option value="signal" data-i18n="signal">C - Señal</option>
        </select>
        <button class="btn-fs" id="btn-fullscreen" aria-label="Pantalla completa" data-i18n-aria="fullscreen">⛶</button>
      </div>
    </header>

    <div id="beat-counter" class="beat-counter">-</div>
    <div class="metro-shell">
      <canvas id="visualizer" class="metro-canvas"></canvas>
      
      <div class="metro-center">
        <!-- Wrapper for layout adjustments in Signal -->
        <div id="signal-wrap" style="display:flex; flex-direction:column; align-items:center;">
          <div class="metro-bpm" id="bpm-display">120</div>
          <div id="signal-labels">
            <div class="metro-label">BPM</div>
            <div class="metro-tempo" id="tempo-mark">Allegro</div>
          </div>
        </div>
        <div class="metro-beats" id="beat-indicators"></div>
        <p class="touch-hint" data-i18n="hint">Desliza el tempo hacia arriba o abajo</p>
      </div>

      <div class="metro-settings">
        <div class="setting-group">
          <span style="opacity:0.5">SUB</span>
          <select id="subdivision-select" aria-label="Subdivisiones por pulso" data-i18n-aria="subdivision">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
        <div class="setting-group">
          <span style="opacity:0.5" data-i18n="voiceB">VOZ B</span>
          <select id="poly-select" aria-label="Polirritmo de la voz B" data-i18n-aria="poly">
            <option value="0">Off</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="7">7</option>
          </select>
        </div>
        <div class="setting-group" style="padding:0 10px;">
          <span style="opacity:0.5">VOL</span>
          <input type="range" id="vol-slider" min="0" max="1" step="0.01" aria-label="Volumen" data-i18n-aria="volume">
        </div>
      </div>

      <div class="metro-controls">
        <button class="m-btn" id="btn-tap" aria-label="Marcar tempo con toques" data-i18n-aria="tap">TAP</button>
        <button class="m-btn" id="btn-bpm-down" aria-label="Bajar tempo" data-i18n-aria="bpmDown">−</button>
        <button class="m-btn" id="btn-ts-down" aria-label="Quitar un pulso del compás" data-i18n-aria="beatDown" style="margin-right:1rem;">◁</button>
        
        <button class="m-play" id="btn-play" aria-label="Iniciar metrónomo" data-i18n-aria="start" aria-pressed="false">
          <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-stop" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 6h12v12H6z"/></svg>
        </button>

        <button class="m-btn" id="btn-ts-up" aria-label="Añadir un pulso al compás" data-i18n-aria="beatUp" style="margin-left:1rem;">▷</button>
        <button class="m-btn" id="btn-bpm-up" aria-label="Subir tempo" data-i18n-aria="bpmUp">+</button>
      </div>
    </div>
  </div>

  <script>
    // ===== IDIOMA (?lang=es|en; el sitio lo pasa al iframe) =====

    // ===== STATE MANAGER =====
    class StateManager {
      constructor() {
        const defaultState = {
          bpm: 120, beatsPerMeasure: 4, subdivision: 1, accentPattern: [3, 1, 1, 1],
          volume: 0.8, polyVozB: 0, theme: 'vortex'
        };
        try {
          const saved = localStorage.getItem('metronomo_pro_state_v1');
          this.state = saved ? { ...defaultState, ...JSON.parse(saved) } : defaultState;
        } catch (e) { this.state = defaultState; }
        this.listeners = [];
      }
      get(key) { return this.state[key]; }
      set(key, value) {
        if (key === 'bpm') value = Math.max(20, Math.min(240, value));
        if (key === 'beatsPerMeasure') {
          const oldLen = this.state.accentPattern.length;
          const newLen = value;
          if (newLen > oldLen) this.state.accentPattern = [...this.state.accentPattern, ...Array(newLen - oldLen).fill(1)];
          else if (newLen < oldLen) this.state.accentPattern = this.state.accentPattern.slice(0, newLen);
          if (this.state.accentPattern[0] !== 3) this.state.accentPattern[0] = 3;
        }
        this.state[key] = value;
        try { localStorage.setItem('metronomo_pro_state_v1', JSON.stringify(this.state)); } catch (e) { /* sin almacenamiento */ }
        this.notify(key, value);
      }
      updateAccent(index) {
        let val = this.state.accentPattern[index];
        val = (val === 0) ? 3 : val - 1;
        this.state.accentPattern[index] = val;
        try { localStorage.setItem('metronomo_pro_state_v1', JSON.stringify(this.state)); } catch (e) { /* sin almacenamiento */ }
        this.notify('accentPattern', this.state.accentPattern);
      }
      subscribe(callback) { this.listeners.push(callback); }
      notify(key, value) { this.listeners.forEach(cb => cb(key, value)); }
    }
    const state = new StateManager();

    // ===== MULTI-VISUALIZER =====
    class VisualizerManager {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.theme = 'vortex';
        this.animReq = null;
        this.data = {};
        
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.setTheme(state.get('theme'));
      }
      
      resize() {
        this.canvas.width = this.canvas.parentElement.clientWidth;
        this.canvas.height = this.canvas.parentElement.clientHeight;
        this.cx = this.canvas.width / 2;
        this.cy = this.canvas.height / 2;
      }

      setTheme(t) {
        this.theme = t;
        if (this.animReq) cancelAnimationFrame(this.animReq);
        this.data = {}; // reset state
        
        if (t === 'vortex') {
          this.data.angle = 0;
          this.data.rings = [];
        } else if (t === 'membrane') {
          this.data.p = { angle: 0, velocity: 0 };
          this.data.waves = [];
        } else if (t === 'signal') {
          this.data.t = 0;
          this.data.pulses = [];
        }
        this.animate();
      }

      triggerBeat(beat, isVozB) {
        const type = state.get('accentPattern')[beat];
        
        if (this.theme === 'vortex') {
          const color = isVozB ? '0,255,136' : (beat===0 ? '251,146,60' : beat===1 ? '244,114,182' : '167,139,250');
          this.data.rings.push({ r: 80, maxR: beat === 0 ? 500 : 350, alpha: 1, color });
        } 
        else if (this.theme === 'membrane') {
          if (!isVozB) {
            this.data.p.velocity = beat % 2 === 0 ? 0.22 : -0.22;
            this.data.waves.push({ phase: 0 });
          }
        }
        else if (this.theme === 'signal') {
          if (!isVozB) this.data.pulses.push({ x: 0, beat, life: 1 });
        }
      }

      animate() {
        const W = this.canvas.width; const H = this.canvas.height;
        const cx = this.cx; const cy = this.cy;
        this.ctx.clearRect(0, 0, W, H);

        if (this.theme === 'vortex') {
          this.data.angle += 0.004;
          const R = Math.min(cx, cy) * 0.62;
          const segments = 60;
          for (let i = 0; i < segments; i++) {
            const a1 = this.data.angle + (i / segments) * Math.PI * 2;
            const a2 = a1 + (Math.PI * 2 / segments) * 0.7;
            this.ctx.beginPath(); this.ctx.arc(cx, cy, R, a1, a2);
            this.ctx.strokeStyle = `rgba(167,139,250,${(i / segments) * 0.35})`;
            this.ctx.lineWidth = 2; this.ctx.stroke();
          }
          const R2 = R * 0.78;
          for (let i = 0; i < segments; i++) {
            const a1 = -this.data.angle * 0.6 + (i / segments) * Math.PI * 2;
            const a2 = a1 + (Math.PI * 2 / segments) * 0.5;
            this.ctx.beginPath(); this.ctx.arc(cx, cy, R2, a1, a2);
            this.ctx.strokeStyle = `rgba(244,114,182,${(i / segments) * 0.2})`;
            this.ctx.lineWidth = 1.5; this.ctx.stroke();
          }
          const beats = state.get('beatsPerMeasure');
          for (let i = 0; i < beats; i++) {
            const a = (i / beats) * Math.PI * 2 - Math.PI / 2;
            const x1 = cx + (R + 12) * Math.cos(a), y1 = cy + (R + 12) * Math.sin(a);
            const x2 = cx + (R + 20) * Math.cos(a), y2 = cy + (R + 20) * Math.sin(a);
            this.ctx.beginPath(); this.ctx.moveTo(x1, y1); this.ctx.lineTo(x2, y2);
            this.ctx.strokeStyle = i === 0 ? 'rgba(251,146,60,0.8)' : 'rgba(167,139,250,0.4)';
            this.ctx.lineWidth = i === 0 ? 2 : 1; this.ctx.stroke();
          }
          for (let i = this.data.rings.length - 1; i >= 0; i--) {
            const r = this.data.rings[i];
            r.r += 6; r.alpha -= 6 / r.maxR;
            if (r.alpha <= 0) { this.data.rings.splice(i, 1); continue; }
            this.ctx.beginPath(); this.ctx.arc(cx, cy, r.r, 0, Math.PI * 2);
            this.ctx.strokeStyle = `rgba(${r.color},${Math.max(0, r.alpha)})`;
            this.ctx.lineWidth = 2.5; this.ctx.stroke();
          }
        } 
        else if (this.theme === 'membrane') {
          this.ctx.fillStyle = 'rgba(255,200,100,0.012)';
          for (let i = 0; i < 80; i++) {
            this.ctx.beginPath();
            this.ctx.arc(cx + (Math.sin(i * 7.3 + Date.now() * 0.0003) * W * 0.45), H * 0.3 + Math.cos(i * 5.1 + Date.now() * 0.0002) * H * 0.3, Math.random() * 1.5, 0, Math.PI * 2);
            this.ctx.fill();
          }
          const p = this.data.p; p.velocity -= p.angle * 0.04; p.velocity *= 0.92; p.angle += p.velocity;
          const pivotY = H * 0.12; const armLen = H * 0.45;
          const bobX = cx + Math.sin(p.angle) * armLen; const bobY = pivotY + Math.cos(p.angle) * armLen;
          this.ctx.beginPath(); this.ctx.moveTo(cx, pivotY); this.ctx.lineTo(bobX, bobY);
          this.ctx.strokeStyle = 'rgba(249,115,22,0.12)'; this.ctx.lineWidth = 18; this.ctx.lineCap = 'round'; this.ctx.stroke();
          this.ctx.beginPath(); this.ctx.moveTo(cx, pivotY); this.ctx.lineTo(bobX, bobY);
          this.ctx.strokeStyle = 'rgba(245,230,211,0.35)'; this.ctx.lineWidth = 2; this.ctx.stroke();
          this.ctx.beginPath(); this.ctx.arc(bobX, bobY, 14, 0, Math.PI * 2);
          this.ctx.fillStyle = '#f97316'; this.ctx.shadowColor = '#f97316'; this.ctx.shadowBlur = 30; this.ctx.fill(); this.ctx.shadowBlur = 0;
          this.ctx.beginPath(); this.ctx.arc(cx, pivotY, 4, 0, Math.PI * 2);
          this.ctx.fillStyle = 'rgba(245,230,211,0.5)'; this.ctx.fill();

          const wY = H * 0.88;
          this.data.waves = this.data.waves.filter(w => w.phase < Math.PI * 3);
          this.data.waves.forEach(w => w.phase += 0.08);
          this.ctx.beginPath(); this.ctx.moveTo(0, wY);
          for (let x = 0; x < W; x += 2) {
            let y = wY;
            this.data.waves.forEach(w => {
              const nx = (x - W / 2) / W; const dist = Math.abs(nx) * 8;
              const amp = 18 * Math.max(0, 1 - w.phase / (Math.PI * 3));
              y += Math.sin(w.phase + dist * 4) * amp * Math.exp(-dist);
            });
            this.ctx.lineTo(x, y);
          }
          this.ctx.strokeStyle = 'rgba(249,115,22,0.45)'; this.ctx.lineWidth = 1.5; this.ctx.stroke();
        }
        else if (this.theme === 'signal') {
          this.data.t += 0.012;
          this.ctx.strokeStyle = 'rgba(0,0,0,0.06)'; this.ctx.lineWidth = 1;
          for (let x = 0; x < W; x += 60) { this.ctx.beginPath(); this.ctx.moveTo(x, 0); this.ctx.lineTo(x, H); this.ctx.stroke(); }
          for (let y = 0; y < H; y += 60) { this.ctx.beginPath(); this.ctx.moveTo(0, y); this.ctx.lineTo(W, y); this.ctx.stroke(); }
          
          const lineY = H * 0.78; this.ctx.beginPath();
          for (let x = 0; x < W; x += 2) {
            const nx = x / W; let y = lineY;
            y += Math.sin(nx * 12 + this.data.t * 2) * 6 * (audio.isPlaying ? 1 : 0.2);
            this.data.pulses.forEach(p => {
              const dx = nx - p.x;
              if (dx > 0 && dx < 0.5) {
                const amp = p.beat === 0 ? 22 : 12;
                y -= Math.sin(dx * Math.PI / 0.08) * amp * p.life * Math.max(0, 1 - dx * 6);
              }
            });
            if (x === 0) this.ctx.moveTo(x, y); else this.ctx.lineTo(x, y);
          }
          this.ctx.strokeStyle = '#2563eb'; this.ctx.lineWidth = 1.5; this.ctx.stroke();
          
          this.data.pulses.forEach(p => { p.x += 0.008; p.life -= 0.025; });
          this.data.pulses = this.data.pulses.filter(p => p.life > 0 && p.x < 1.2);

          const scanX = (this.data.t * 0.15 % 1) * W;
          this.ctx.beginPath(); this.ctx.moveTo(scanX, 0); this.ctx.lineTo(scanX, H);
          this.ctx.strokeStyle = 'rgba(37,99,235,0.06)'; this.ctx.lineWidth = 20; this.ctx.stroke();
        }
        
        this.animReq = requestAnimationFrame(() => this.animate());
      }
    }

    // ===== AUDIO ENGINE (Unchanged precision) =====
    class AudioEngine {
      constructor(stateManager) {
        this.state = stateManager; this.ctx = null; this.isPlaying = false;
        this.lookahead = 25.0; this.scheduleAheadTime = 0.1;
        this.nextNoteTime = 0.0; this.currentBeat = 0; this.currentSubdivision = 0;
        this.nextNoteTimeB = 0.0; this.currentBeatB = 0;
        
        const workerCode = `
          let timerID = null;
          self.onmessage = function(e) {
            if (e.data.action === "start") {
              timerID = setInterval(() => postMessage("tick"), e.data.interval);
            } else if (e.data.action === "stop") {
              clearInterval(timerID); timerID = null;
            }
          };
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        this.worker = new Worker(URL.createObjectURL(blob));
        this.worker.onmessage = () => this.scheduler();
      }
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      scheduleNote(beatNumber, subNumber, time, isVozB = false) {
        if (!isVozB) {
          const isMainBeat = subNumber === 0;
          const accentState = this.state.get('accentPattern')[beatNumber];
          if (isMainBeat && accentState === 0) { this.dispatchVisualEvent(beatNumber, accentState, time, false); return; }

          const osc = this.ctx.createOscillator(); const gainNode = this.ctx.createGain();
          osc.connect(gainNode); gainNode.connect(this.ctx.destination);
          
          // Original prompt frequencies: Beat 1 = 1400, others 880
          let freq = 880; let volMultiplier = 0.6;
          if (!isMainBeat) { freq = 600; volMultiplier = 0.2; }
          else { if (accentState === 3) { freq = 1400; volMultiplier = 1.0; } else if (accentState === 2) { freq = 1100; volMultiplier = 0.8; } }

          osc.type = 'sine'; osc.frequency.value = freq;
          const attack = 0.001; const decay = isMainBeat ? 0.06 : 0.03;
          const peak = this.state.get('volume') * volMultiplier;

          gainNode.gain.setValueAtTime(0, time);
          gainNode.gain.linearRampToValueAtTime(peak, time + attack);
          gainNode.gain.exponentialRampToValueAtTime(0.001, time + attack + decay);
          osc.start(time); osc.stop(time + attack + decay + 0.01);
          if (isMainBeat) this.dispatchVisualEvent(beatNumber, accentState, time, false);
        } else {
          const osc = this.ctx.createOscillator(); const gainNode = this.ctx.createGain();
          osc.connect(gainNode); gainNode.connect(this.ctx.destination);
          osc.type = 'square'; osc.frequency.value = beatNumber === 0 ? 900 : 500; 
          const attack = 0.001; const decay = 0.05;
          const peak = this.state.get('volume') * 0.3;
          gainNode.gain.setValueAtTime(0, time);
          gainNode.gain.linearRampToValueAtTime(peak, time + attack);
          gainNode.gain.exponentialRampToValueAtTime(0.001, time + attack + decay);
          osc.start(time); osc.stop(time + attack + decay + 0.01);
          this.dispatchVisualEvent(beatNumber, 1, time, true);
        }
      }
      dispatchVisualEvent(beat, accent, time, isVozB) {
        const timeToPlay = time - this.ctx.currentTime;
        const trigger = () => window.dispatchEvent(new CustomEvent('beatEvent', { detail: { beat, accent, isVozB } }));
        if (timeToPlay > 0) setTimeout(trigger, timeToPlay * 1000); else trigger();
      }
      scheduler() {
        while (this.nextNoteTime < this.ctx.currentTime + this.scheduleAheadTime) {
          this.scheduleNote(this.currentBeat, this.currentSubdivision, this.nextNoteTime, false);
          const subdivs = this.state.get('subdivision') || 1; const secondsPerBeat = 60.0 / (this.state.get('bpm') || 120);
          this.nextNoteTime += secondsPerBeat / subdivs; this.currentSubdivision++;
          if (this.currentSubdivision >= subdivs) { this.currentSubdivision = 0; this.currentBeat = (this.currentBeat + 1) % (this.state.get('beatsPerMeasure') || 4); }
        }
        const poly = this.state.get('polyVozB') || 0;
        if (poly > 0) {
          while (this.nextNoteTimeB < this.ctx.currentTime + this.scheduleAheadTime) {
            this.scheduleNote(this.currentBeatB, 0, this.nextNoteTimeB, true);
            const beatsA = this.state.get('beatsPerMeasure') || 4; const secondsPerBeatA = 60.0 / (this.state.get('bpm') || 120);
            this.nextNoteTimeB += (beatsA * secondsPerBeatA) / poly;
            this.currentBeatB = (this.currentBeatB + 1) % poly;
          }
        }
      }
      toggle() { this.init(); if (this.isPlaying) this.stop(); else this.play(); }
      play() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.isPlaying = true; this.currentBeat = 0; this.currentSubdivision = 0; this.currentBeatB = 0;
        this.nextNoteTime = this.ctx.currentTime + 0.05; this.nextNoteTimeB = this.nextNoteTime;
        this.worker.postMessage({ action: 'start', interval: this.lookahead });
      }
      stop() { 
        this.isPlaying = false; 
        this.worker.postMessage({ action: 'stop' }); 
        document.getElementById('beat-counter').textContent = '-';
      }
    }
    const audio = new AudioEngine(state);
    const visualizer = new VisualizerManager('visualizer');

    // ===== UI DOM LOGIC =====

    let tapTimes = [];
    document.getElementById('btn-tap').addEventListener('click', () => {
      const now = performance.now();
      if (tapTimes.length > 0 && now - tapTimes[tapTimes.length - 1] > 2000) tapTimes = [];
      tapTimes.push(now); if (tapTimes.length > 4) tapTimes.shift();
      if (tapTimes.length >= 2) {
        let sumDelta = 0; for (let i = 1; i < tapTimes.length; i++) sumDelta += tapTimes[i] - tapTimes[i-1];
        const tappedBpm = Math.round(60000 / (sumDelta / (tapTimes.length - 1)));
        if (tappedBpm >= 20 && tappedBpm <= 240) state.set('bpm', tappedBpm);
      }
    });

    function getTempoMarking(bpm) {
      if (bpm <= 60) return "Largo"; if (bpm <= 76) return "Adagio";
      if (bpm <= 108) return "Andante"; if (bpm <= 120) return "Moderato";
      if (bpm <= 168) return "Allegro"; if (bpm <= 200) return "Presto"; return "Prestissimo";
    }

    function renderBeatDots() {
      const beats = state.get('beatsPerMeasure');
      const pattern = state.get('accentPattern');
      beatIndicators.innerHTML = '';
      for (let i = 0; i < beats; i++) {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.setAttribute('aria-label', t('beat', { n: i + 1, a: pattern[i] }));
        dot.className = 'beat-dot'; dot.dataset.state = pattern[i];

    document.getElementById('subdivision-select').addEventListener('change', (e) => state.set('subdivision', parseInt(e.target.value)));

    document.getElementById('theme-select').addEventListener('change', (e) => state.set('theme', e.target.value));

    let dragPointer = null; let startY = 0; let startBpm = 0;
    bpmDisplay.addEventListener('pointerdown', (e) => {

    bpmDisplay.addEventListener('pointermove', (e) => {

    const endTempoDrag = () => { dragPointer = null; };
    bpmDisplay.addEventListener('pointerup', endTempoDrag);

    window.addEventListener('keydown', (e) => {

        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else if (document.exitFullscreen) await document.exitFullscreen();
      } catch (error) { /* Some mobile browsers disallow fullscreen in this context. */ }
    });

    // BEAT PULSE
    window.addEventListener('beatEvent', (e) => {
      const { beat, accent, isVozB } = e.detail;
      if (accent === 0 && !isVozB) return;
      
      visualizer.triggerBeat(beat, isVozB);
      
      if (!isVozB) {
        const dots = beatIndicators.children;
        if (dots[beat]) dots[beat].classList.add(`lit-${accent}`);
        
        const beatCounter = document.getElementById('beat-counter');
        beatCounter.textContent = beat + 1;
        beatCounter.classList.add('active');
        
        bpmDisplay.classList.remove('pulse', 'pulse-accent', 'pulse-down');
        void bpmDisplay.offsetWidth; // reflow
        
        if (accent === 3) bpmDisplay.classList.add('pulse-down');
        else if (accent === 2) bpmDisplay.classList.add('pulse-accent');
        else bpmDisplay.classList.add('pulse');

        setTimeout(() => {
          if (dots[beat]) dots[beat].classList.remove(`lit-${accent}`);
          beatCounter.classList.remove('active');
        }, 120);
      }
      setTimeout(() => bpmDisplay.classList.remove('pulse', 'pulse-accent', 'pulse-down'), 120);
    });
  </script>
</body>
</html>
