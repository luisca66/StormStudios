name: Website and apps quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run apps:install
      - run: npm run lint
      - run: npm test
      - run: npm run apps:check
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run apps:audit
